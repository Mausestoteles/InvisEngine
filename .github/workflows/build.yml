name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # bundle.active is false, so this yields only the standalone exe (no installer).
      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: InvisEngine-portable
          path: src-tauri/target/release/invis-engine.exe
